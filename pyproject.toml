[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-local-rag-demo"
version = "0.1.0"
description = "Local hybrid RAG demo with source verification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "qdrant-client>=1.20,<1.21",
  "sentence-transformers>=3,<6",
  "httpx>=0.27,<1",
  "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/secure_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache"]
